# Configurazione Alembic per le migrazioni dello schema.
#
# Il `sqlalchemy.url` viene sovrascritto a runtime da `env.py` leggendo
# `DATABASE_URL` dalle impostazioni dell'app. Lascia il placeholder qui
# per non far esplodere il tool su `alembic current` senza app context.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

# Nome dei file di migrazione: timestamp + slug + revision_id
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Path-separator per migrazioni multi-versione (non usato qui, una sola
# linea di sviluppo).
version_path_separator = os

[post_write_hooks]
# Disabilitato: il post-hook ruff non risolve entrypoint console_scripts
# in alcuni env. Eseguire manualmente: `ruff format alembic/versions/`.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
