services:
  postgres:
    image: postgres:16-alpine
    container_name: risiko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: risiko_review
      POSTGRES_USER: risiko
      POSTGRES_PASSWORD: risiko_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risiko -d risiko_review"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: risiko-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
